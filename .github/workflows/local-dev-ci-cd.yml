name: Local Dev CI/CD

on:
  push:
    branches:
      - local-dev
  pull_request:
    branches:
      - local-dev
  workflow_dispatch:

jobs:
  frontend_ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/local-dev'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            .next
            public
            package.json
            package-lock.json
            next.config.js

  backend_ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate backend syntax
        run: python -m compileall -q backend

      - name: Upload backend artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/local-dev'
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend

  cd_package:
    name: CD Package (local-dev)
    runs-on: ubuntu-latest
    needs:
      - frontend_ci
      - backend_ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/local-dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: deploy/frontend

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: deploy/backend

      - name: Create deployment bundle
        run: |
          tar -czf local-dev-bundle.tar.gz deploy

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: local-dev-bundle
          path: local-dev-bundle.tar.gz

  deploy_vercel:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs:
      - frontend_ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/local-dev' && secrets.VERCEL_DEPLOY_HOOK_LOCAL_DEV != ''

    steps:
      - name: Trigger Vercel deploy hook
        run: |
          curl -X POST "$VERCEL_DEPLOY_HOOK_LOCAL_DEV"
        env:
          VERCEL_DEPLOY_HOOK_LOCAL_DEV: ${{ secrets.VERCEL_DEPLOY_HOOK_LOCAL_DEV }}
